# Full-stack production deployment
# Usage:
#   cp backend/.env.example backend/.env   (then edit with real values)
#   cp frontend/.env.example frontend/.env (then edit with real values)
#   docker compose up -d --build

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["127.0.0.1:4000:4000"]
    env_file: ./backend/.env
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      - BACKEND_URL=http://backend:4000
    depends_on:
      backend:
        condition: service_healthy

  # Optional: local MongoDB for development. Remove in production if using Atlas.
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]

volumes:
  uploads:
  mongo-data:
